[platformio]
default_envs = eego_a4
build_cache_dir = .cache

[crosspoint]
version = 1.5.5

[common]
lib_deps_runtime =
  ; Template hardware libs are local (lib/), so only external Arduino deps go here.
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  knolleary/PubSubClient @ ^2.8

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

; pioarduino fork marks the Arduino core as optional; request it explicitly.
platform_packages =
  framework-arduinoespressif32
  framework-arduinoespressif32-libs

; --- CrossMux / CrossPoint base compiler flags ------------------------------
build_unflags =
  -std=gnu++11
  -fexceptions

build_flags =
  -std=gnu++2a
  -fno-exceptions
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -DFREEINK_DEVICE_EEGO_A4=1
  -DCROSSPOINT_EXPERIMENTAL_HARDWARE=1
  -DENABLE_CHINESE_VERSION
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  ; wolfSSL TLS 1.3 transport (freeink SecureClient) — see lib/SecureNet.
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_HAVE_SP_RSA
  -DWOLFSSL_SP_SMALL
  -DWOLFSSL_SP_4096
  -DHAVE_MAX_FRAGMENT
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  ; Linker wraps for panic inspection + OTA atomicity + wolfSSL SNI (src/platform/).
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity,--wrap=wolfSSL_UseSNI

monitor_filters =
  esp32_exception_decoder
  time

; --- CrossMux / CrossPoint run-time library deps ----------------------------
lib_deps =
  greiman/SdFat @ 2.3.1
  adafruit/Adafruit GFX Library @ 1.12.6
  wolfssl/Arduino-wolfSSL @ 5.7.2
  ${common.lib_deps_runtime}

lib_ignore =
  BLE

; --- CrossMux / CrossPoint pre-build scripts --------------------------------
extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/patch_spi_mutex.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py

[env:eego_a4]
build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>
  -<../examples/>
  -<app/>

[env:eego_a4_diagnostics]
lib_deps =
  greiman/SdFat @ 2.3.1
  adafruit/Adafruit GFX Library @ 1.12.6
  h2zero/NimBLE-Arduino @ 2.5.0
build_src_filter =
  +<*>
  -<../examples/>

[env:eego_a4_quickstart]
lib_deps = ${common.lib_deps_runtime}
build_src_filter =
  -<*>
  +<../examples/01_quickstart_display_input/main.cpp>

[env:eego_a4_storage_rtc_battery]
lib_deps = ${common.lib_deps_runtime}
build_src_filter =
  -<*>
  +<../examples/02_storage_rtc_battery/main.cpp>

[env:eego_a4_cpfont]
lib_deps = ${common.lib_deps_runtime}
build_src_filter =
  -<*>
  +<../examples/05_cpfont_chinese/main.cpp>