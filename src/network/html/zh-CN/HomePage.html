<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备概览 - CrossMux</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ef;
        --card-bg: #fffdf9;
        --font-color: #292524;
        --label-color: #78716c;
        --border-color: #e7e1d8;
        --accent-color: #a8502f;
        --accent-soft: #f3ddd0;
        --success-color: #47745c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #1c1917;
          --card-bg: #292524;
          --font-color: #fafaf9;
          --label-color: #d6d3d1;
          --border-color: #44403c;
          --accent-color: #d59475;
          --accent-soft: #533326;
          --success-color: #84b498;
        }
      }
      * { box-sizing: border-box; }
      body {
        max-width: 720px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 0 12px 24px;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--font-color);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .nav-links {
        position: sticky;
        top: 0;
        z-index: 100;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        margin: 0 -12px 16px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg);
      }
      .nav-links a {
        min-width: 0;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        border-radius: 8px;
        color: var(--label-color);
        font-size: 0.92rem;
        font-weight: 650;
        text-decoration: none;
        white-space: nowrap;
      }
      .nav-links a.active { background: var(--accent-color); color: #fff; }
      .nav-links a:not(.active):hover { background: var(--accent-soft); color: var(--font-color); }
      main { padding-top: 4px; }
      .page-title { margin: 0 0 14px; }
      h1 {
        margin: 0;
        font-family: "Songti SC", STSong, "Noto Serif CJK SC", serif;
        font-size: 1.35rem;
        line-height: 1.3;
      }
      .page-title p { margin: 4px 0 0; color: var(--label-color); font-size: 0.88rem; }
      .device-card {
        overflow: hidden;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: var(--card-bg);
      }
      .device-head {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border-color);
      }
      .device-head strong { font-size: 0.95rem; }
      .online { display: inline-flex; align-items: center; gap: 7px; color: var(--success-color); font-size: 0.82rem; font-weight: 700; }
      .online::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      dl { margin: 0; padding: 0 14px; }
      .row {
        min-height: 48px;
        display: grid;
        grid-template-columns: 6em minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--border-color);
      }
      .row:last-child { border-bottom: 0; }
      dt { color: var(--label-color); font-size: 0.88rem; }
      dd { min-width: 0; margin: 0; overflow-wrap: anywhere; text-align: right; font-weight: 650; }
      .note { margin: 0; padding: 12px 14px; border-top: 1px solid var(--border-color); color: var(--label-color); font-size: 0.8rem; }
      @media (min-width: 720px) {
        body { padding: 0 20px 32px; }
        .nav-links { margin: 0 -20px 24px; padding: 10px 20px; }
        main { padding-top: 12px; }
        h1 { font-size: 1.5rem; }
        .device-card { border-radius: 14px; }
        .device-head, dl { padding-left: 20px; padding-right: 20px; }
        .note { padding-left: 20px; padding-right: 20px; }
      }
    </style>
  </head>
  <body>
    <nav class="nav-links" aria-label="主导航">
      <a href="/" class="active" aria-current="page">主页</a>
      <a href="/files">文件</a>
      <a href="/settings">设置</a>
      <a href="/fonts">字体</a>
    </nav>
    <main>
      <div class="page-title">
        <h1>设备概览</h1>
        <p>CrossMux 设备状态与网络信息</p>
      </div>
      <section class="device-card" aria-labelledby="status-title">
        <div class="device-head">
          <strong id="status-title">当前设备</strong>
          <span class="online">已连接</span>
        </div>
        <dl>
          <div class="row"><dt>序列号</dt><dd id="serial">读取中…</dd></div>
          <div class="row"><dt>固件版本</dt><dd id="version">读取中…</dd></div>
          <div class="row"><dt>IP 地址</dt><dd id="ip-address">读取中…</dd></div>
          <div class="row"><dt>可用内存</dt><dd id="free-heap">读取中…</dd></div>
        </dl>
        <p class="note" id="status-note">状态信息来自当前设备</p>
      </section>
    </main>
    <script>
      async function fetchStatus() {
        const fallback = '不可用';
        try {
          const response = await fetch('/api/status');
          if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
          const data = await response.json();
          document.getElementById('version').textContent = data.version || fallback;
          document.getElementById('serial').textContent = data.serial || fallback;
          document.getElementById('ip-address').textContent = data.ip || fallback;
          document.getElementById('free-heap').textContent = data.freeHeap
            ? data.freeHeap.toLocaleString('zh-CN') + ' 字节'
            : fallback;
        } catch (error) {
          document.getElementById('status-note').textContent = '暂时无法读取设备状态：' + error.message;
        }
      }
      fetchStatus();
    </script>
  </body>
</html>
