<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字体管理 - CrossMux</title>
    <style>
      h3 { margin: 0 0 8px 0; }
      .family {
        border-bottom: 1px solid var(--border-color);
        padding: 12px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .family:last-child { border-bottom: none; }
      .family-info { flex: 1; }
      .family-meta { color: var(--label-color); font-size: 0.9em; }
      .btn {
        padding: 6px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
      }
      .btn-danger {
        background: var(--danger-color);
        color: var(--button-text);
      }
      .btn-danger:hover { background: var(--danger-hover); }
      .btn-primary {
        background: var(--accent-color);
        color: var(--button-text);
      }
      .btn-primary:hover { background: var(--accent-hover-color); }
      .upload-form {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .upload-form input[type="text"] {
        padding: 6px 10px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--bg);
        color: var(--font-color);
      }
      .upload-form input[type="file"] { flex: 1; min-width: 200px; }
      .empty { color: var(--label-color); text-align: center; padding: 20px; }
    </style>
    <link rel="stylesheet" href="/assets/web.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/crosspoint-icon.svg" />
</head>
  <body class="web-ui">
    <!--#include file="../shared/Header.zh-CN.html.inc" -->
<main class="page-content">

    <div class="card">
      <h2>已安装字体</h2>
      <div id="families"><p class="empty">正在读取…</p></div>
    </div>

    <div class="card">
      <h2>上传字体</h2>
      <form class="upload-form" id="uploadForm">
        <input type="file" id="fontFiles" webkitdirectory directory multiple required />
        <button type="submit" class="btn btn-primary">上传</button>
      </form>
      <p id="pickedInfo" class="family-meta" style="margin: 8px 0 0;"></p>
    </div>

  </main>
<!--#include file="../shared/Footer.zh-CN.html.inc" -->
<script>
    function formatSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    // PSRAM boards also accept vector (.ttf/.otf) uploads; set from /api/fonts.
    let allowVector = false;

    function fontExtRe() {
      return allowVector ? /\.(cpfont|ttf|otf)$/i : /\.cpfont$/i;
    }

    function supportedExts() {
      return allowVector ? '.cpfont、.ttf 或 .otf' : '.cpfont';
    }

    async function loadFonts() {
      const el = document.getElementById('families');
      try {
        const res = await fetch('/api/fonts');
        const data = await res.json();
        allowVector = !!data.vectorFonts;
        // Build rows with DOM APIs and textContent so on-device family names
        // (which can contain arbitrary characters) cannot break markup or
        // execute script via innerHTML / inline onclick interpolation.
        el.replaceChildren();
        if (!data.families || data.families.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = '尚未安装自定义字体';
          el.appendChild(p);
          return;
        }
        for (const f of data.families) {
          const row = document.createElement('div');
          row.className = 'family';

          const info = document.createElement('div');
          info.className = 'family-info';
          const h3 = document.createElement('h3');
          h3.textContent = f.name;
          info.appendChild(h3);
          const meta = document.createElement('span');
          meta.className = 'family-meta';
          const sizes = (f.sizes || []).filter(size => size > 0);
          const sizeText = sizes.length ? sizes.join(', ') + 'pt' : '可缩放';
          const filesSizes = (f.files || []).map(fi => formatSize(fi.size)).join(' + ');
          meta.textContent = sizeText + ' · ' + filesSizes;
          info.appendChild(meta);

          const btn = document.createElement('button');
          btn.className = 'btn btn-danger';
          btn.textContent = '删除';
          // Capture name in the closure rather than interpolating into onclick.
          const familyName = f.name;
          btn.addEventListener('click', () => deleteFamily(familyName));

          row.appendChild(info);
          row.appendChild(btn);
          el.appendChild(row);
        }
      } catch (e) {
        el.replaceChildren();
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = '无法读取字体列表';
        el.appendChild(p);
      }
    }

    async function deleteFamily(name) {
      if (!await showWebConfirm('确定删除字体家族“' + name + '”吗？')) return;
      try {
        const res = await fetch('/api/fonts/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({family: name})
        });
        if (res.ok) {
          showWebToast('已删除“' + name + '”。', false);
        } else {
          showWebToast('删除“' + name + '”失败。', true);
        }
      } catch (err) {
        showWebToast('删除出错：' + err.message, true);
      }
      await loadFonts();
    }

    // Derive family name from a .cpfont filename: take everything before the
    // last '-' or '_' (that separator precedes the size suffix, e.g. Bookerly_12.cpfont).
    function familyFromFilename(name) {
      const stem = name.replace(/\.(cpfont|ttf|otf)$/i, '');
      const cut = Math.max(stem.lastIndexOf('-'), stem.lastIndexOf('_'));
      return cut > 0 ? stem.slice(0, cut) : stem;
    }

    // Sanitize to match firmware's [A-Za-z0-9_-]+ pattern.
    function sanitizeFamily(raw) {
      return raw.replace(/[^A-Za-z0-9_-]/g, '_');
    }

    function supportedFontFilesOnly(fileList) {
      return Array.from(fileList).filter(f => fontExtRe().test(f.name));
    }

    document.getElementById('fontFiles').addEventListener('change', function() {
      const info = document.getElementById('pickedInfo');
      const files = supportedFontFilesOnly(this.files);
      if (files.length === 0) {
        info.textContent = '所选文件夹中没有 ' + supportedExts() + ' 文件。';
        return;
      }
      const family = sanitizeFamily(familyFromFilename(files[0].name));
      info.textContent = files.length + ' 个文件 → 字体家族“' + family + '”';
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const files = supportedFontFilesOnly(document.getElementById('fontFiles').files);
      if (files.length === 0) {
        showWebToast('尚未选择 ' + supportedExts() + ' 文件。', true);
        return;
      }

      // A directory picker may include files from multiple family subfolders.
      // Reject that up front — otherwise files[0]'s family is silently reused
      // for every upload, corrupting the install layout.
      const families = [...new Set(files.map(f => sanitizeFamily(familyFromFilename(f.name))))];
      if (families.length !== 1) {
        showWebToast('请只选择同一个字体家族的文件。', true);
        return;
      }
      const family = families[0];


      let uploaded = 0;
      for (const file of files) {
        showWebToast('正在上传 ' + (uploaded + 1) + '/' + files.length + '：' + file.name, false);
        const formData = new FormData();
        formData.append('family', family);
        formData.append('file', file, file.name);
        try {
          const res = await fetch('/api/fonts/upload', { method: 'POST', body: formData });
          const data = await res.json();
          if (!data.ok) {
            showWebToast(file.name + ' 上传失败：' + (data.error || '未知错误'), true);
            await loadFonts();
            return;
          }
        } catch (err) {
          showWebToast(file.name + ' 上传出错：' + err.message, true);
          await loadFonts();
          return;
        }
        uploaded++;
      }

      showWebToast('已将 ' + uploaded + ' 个文件上传到字体家族“' + family + '”。', false);
      await loadFonts();
    });

    loadFonts();
  </script>
  </body>
</html>
