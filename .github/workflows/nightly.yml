name: Firmware Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify Actions artifacts without publishing or cleanup'
        required: false
        type: boolean
        default: false
      notes_en:
        description: 'English OTA release notes (2-8 lines, max 96 ASCII bytes each)'
        required: true
        type: string
      notes_zh:
        description: 'Chinese OTA release notes (2-8 lines, max 32 characters each)'
        required: true
        type: string
  push:
    tags:
      - '*.*.*'

concurrency:
  group: firmware-${{ github.event_name == 'push' && 'stable' || 'nightly' }}-${{ inputs.dry_run && format('dry-run-{0}', github.ref) || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select_runner:
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      matrix: ${{ steps.release.outputs.matrix }}
      build_id: ${{ steps.release.outputs.build_id }}
      build_tag: ${{ steps.release.outputs.build_tag }}
    steps:
      - uses: actions/checkout@v6
      - id: release
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            channel=stable
            version="$(python3 -c 'import configparser; c=configparser.ConfigParser(); c.read("platformio.ini"); print(c["crosspoint"]["version"])')"
            if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::Stable tag $GITHUB_REF_NAME does not match firmware version $version"
              exit 1
            fi
          else
            channel=nightly
          fi
          build_id="${channel}-build-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "build_tag=$build_id" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 scripts/package_nightly_target.py --channel "$channel" --matrix)" >> "$GITHUB_OUTPUT"

  notes:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build release notes
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_ZH: ${{ inputs.notes_zh }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then
            notes=".github/release-notes/${GITHUB_REF_NAME}.md"
            test -f "$notes"
            cp "$notes" release-body.md
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > tag-message.txt
            python3 scripts/generate_ota_notes.py --input tag-message.txt --output ota-notes.md
            test -s ota-notes.md
            printf '\n' >> release-body.md
            cat ota-notes.md >> release-body.md
          else
            printf 'Nightly build `%s` from `%s`.\n' "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" > release-body.md
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              python3 scripts/generate_ota_notes.py \
                --en-notes="$NOTES_EN" --zh-notes="$NOTES_ZH" --output ota-notes.md
              test -s ota-notes.md
              printf '\n' >> release-body.md
              cat ota-notes.md >> release-body.md
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release-notes
          path: |
            release-body.md
            ota-notes.md
          if-no-files-found: warn
          retention-days: 1

  build:
    needs: [prepare, select_runner]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.targetId }} (${{ needs.prepare.outputs.channel }})
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB-${{ matrix.targetId }}" >> "$GITHUB_ENV"
      - name: Use runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false
      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform
      - name: Build unified target
        run: pio run -e "${{ matrix.environment }}"
      - name: Package and verify unified target
        run: |
          set -euo pipefail
          python3 scripts/package_nightly_target.py "${{ matrix.targetId }}" \
            --channel "${{ needs.prepare.outputs.channel }}" \
            --output "dist/${{ matrix.targetId }}"
          (cd "dist/${{ matrix.targetId }}" && sha256sum --check *-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ needs.prepare.outputs.channel }}-${{ matrix.targetId }}
          path: dist/${{ matrix.targetId }}
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: [prepare, notes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-${{ needs.prepare.outputs.channel }}-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release-notes
          path: notes
      - name: Build and verify both regional indexes against local artifacts
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
        run: |
          set -euo pipefail
          notes_args=()
          [ ! -f notes/ota-notes.md ] || notes_args+=(--release-notes notes/ota-notes.md)
          updated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for region in global cn; do
            if [ "$region" = global ]; then
              base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${BUILD_TAG}/"
              index_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHANNEL}/release-index.json"
              index=release-index.json
            else
              base_url="https://assets.crossmux.cn/firmware/builds/${BUILD_ID}/"
              index_url="https://assets.crossmux.cn/firmware/releases/${CHANNEL}/index.json"
              index=release-index-cn.json
            fi
            python3 scripts/build_nightly_index.py \
              --channel "$CHANNEL" --manifests artifacts --region "$region" \
              --base-url "$base_url" --updated-at "$updated_at" --build-id "$BUILD_ID" \
              --output "$index" "${notes_args[@]}"
            python3 scripts/verify_nightly_release.py --channel "$CHANNEL" \
              --index-url "$index_url" --index-file "$index" --artifacts artifacts \
              --expected-sha "$GITHUB_SHA"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: global-release-index
          path: release-index.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: cn-release-index
          path: release-index-cn.json
          if-no-files-found: error
          retention-days: 14

  publish_github:
    if: ${{ !inputs.dry_run }}
    needs: [prepare, notes, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-${{ needs.prepare.outputs.channel }}-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release-notes
          path: notes
      - name: Load previous global Nightly index
        if: needs.prepare.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous/global
          gh release download nightly --repo "$GITHUB_REPOSITORY" \
            --pattern release-index.json --dir previous/global
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.channel == 'nightly'
        with:
          name: previous-global-index
          path: previous/global/release-index.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@v4
        with:
          name: global-release-index
          path: .
      - name: Publish immutable GitHub build
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f -print)
          gh release create "$BUILD_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CrossMux ${CHANNEL^} ${GITHUB_SHA::7} #${GITHUB_RUN_NUMBER}" \
            --notes-file notes/release-body.md --prerelease
      - name: Publish rolling global index last
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          title="CrossMux ${CHANNEL^} (${GITHUB_SHA::7})"
          if gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" --notes-file notes/release-body.md --prerelease
          else
            gh release create "$CHANNEL" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes/release-body.md --prerelease
          fi
          mapfile -t bundles < <(find artifacts -type f -name '*.zip' -print)
          test "${#bundles[@]}" -gt 0
          gh release upload "$CHANNEL" "${bundles[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$CHANNEL" release-index.json --repo "$GITHUB_REPOSITORY" --clobber

  publish_cn:
    if: ${{ !inputs.dry_run }}
    needs: [prepare, notes, validate]
    runs-on: [self-hosted, Linux, X64, h2o]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-${{ needs.prepare.outputs.channel }}-*
          path: artifacts
      - name: Load previous China Nightly index
        if: needs.prepare.outputs.channel == 'nightly'
        run: |
          mkdir -p previous
          curl -fsSL https://assets.crossmux.cn/firmware/releases/nightly/index.json \
            -o previous/cn.json
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.channel == 'nightly'
        with:
          name: previous-cn-index
          path: previous/cn.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@v4
        with:
          name: cn-release-index
          path: .
      - name: Install COS CLI
        run: |
          curl -fsSL https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64 \
            -o "$RUNNER_TEMP/coscli"
          echo "7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91  $RUNNER_TEMP/coscli" \
            | sha256sum --check -
          chmod 0755 "$RUNNER_TEMP/coscli"
          "$RUNNER_TEMP/coscli" --version
      - name: Publish immutable COS objects
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          set -euo pipefail
          cos_args=(--init-skip --disable-log -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" \
            -e "cos.${COS_REGION}.myqcloud.com")
          [ -z "$COS_SESSION_TOKEN" ] || cos_args+=(--token "$COS_SESSION_TOKEN")
          for artifact in artifacts/firmware-*; do
            target="${artifact#artifacts/firmware-${CHANNEL}-}"
            if ! "$RUNNER_TEMP/coscli" cp "${cos_args[@]}" "$artifact/" \
              "cos://${COS_BUCKET}/firmware/builds/${BUILD_ID}/${target}/" \
              --recursive --forbid-overwrite --meta 'Cache-Control:public,max-age=31536000,immutable' \
              --fail-output-path "$RUNNER_TEMP/coscli-errors"; then
              find "$RUNNER_TEMP/coscli-errors" -type f -name error.report -exec cat {} + 2>/dev/null || true
              exit 1
            fi
          done
      - name: Publish rolling China index last
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          cos_args=(--init-skip --disable-log -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" \
            -e "cos.${COS_REGION}.myqcloud.com")
          [ -z "$COS_SESSION_TOKEN" ] || cos_args+=(--token "$COS_SESSION_TOKEN")
          if ! "$RUNNER_TEMP/coscli" cp "${cos_args[@]}" release-index-cn.json \
            "cos://${COS_BUCKET}/firmware/releases/${CHANNEL}/index.json" \
            --meta 'Cache-Control:no-cache' --fail-output-path "$RUNNER_TEMP/coscli-errors"; then
            find "$RUNNER_TEMP/coscli-errors" -type f -name error.report -exec cat {} + 2>/dev/null || true
            exit 1
          fi

  verify_publish:
    if: ${{ !inputs.dry_run }}
    needs: [prepare, publish_github, publish_cn]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify published indexes and assets
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          python3 scripts/verify_nightly_release.py --channel "$CHANNEL" \
            --index-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHANNEL}/release-index.json?run=${GITHUB_RUN_ID}" \
            --expected-sha "$GITHUB_SHA"
          python3 scripts/verify_nightly_release.py --channel "$CHANNEL" \
            --index-url "https://assets.crossmux.cn/firmware/releases/${CHANNEL}/index.json?run=${GITHUB_RUN_ID}" \
            --expected-sha "$GITHUB_SHA"

      - name: Retire obsolete rolling assets after verification
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          gh release download "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
            --pattern release-index.json --dir current
          python3 -c 'import json; i=json.load(open("current/release-index.json")); print("\n".join(t["bundle"]["name"] for t in i["targets"].values()))' > current-assets.txt
          echo release-index.json >> current-assets.txt
          gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > published-assets.txt
          # Only the rolling release is updated; historical version releases stay untouched.
          while IFS= read -r asset; do
            if ! grep -Fxq "$asset" current-assets.txt; then
              gh release delete-asset "$CHANNEL" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done < published-assets.txt

  publish_stable_release:
    if: ${{ !inputs.dry_run && needs.prepare.outputs.channel == 'stable' }}
    needs: [prepare, notes, build, verify_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-stable-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release-notes
          path: notes
      - uses: actions/download-artifact@v4
        with:
          name: global-release-index
          path: .
      - name: Publish versioned release bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(artifacts/*.zip release-index.json)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "CrossMux $GITHUB_REF_NAME" --notes-file notes/release-body.md --latest
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "CrossMux $GITHUB_REF_NAME" --notes-file notes/release-body.md --latest
          fi

  cleanup_github:
    if: ${{ !inputs.dry_run && needs.prepare.outputs.channel == 'nightly' }}
    needs: [prepare, verify_publish, publish_github]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: previous-global-index
          path: previous/global
      - name: Delete obsolete GitHub Nightly builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            > github-releases.txt
          python3 scripts/nightly_retention.py --storage github --current "$BUILD_TAG" \
            --previous-index previous/global/release-index.json --candidates github-releases.txt \
            > obsolete-github-builds.txt
          while IFS= read -r build_tag; do
            gh release delete "$build_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < obsolete-github-builds.txt

  cleanup_cn:
    if: ${{ !inputs.dry_run && needs.prepare.outputs.channel == 'nightly' }}
    needs: [prepare, verify_publish, publish_cn]
    runs-on: [self-hosted, Linux, X64, h2o]
    permissions:
      contents: read
    env:
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: previous-cn-index
          path: previous
      - name: Install COS CLI
        run: |
          curl -fsSL https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64 \
            -o "$RUNNER_TEMP/coscli"
          echo "7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91  $RUNNER_TEMP/coscli" \
            | sha256sum --check -
          chmod 0755 "$RUNNER_TEMP/coscli"
      - name: Delete obsolete COS Nightly builds
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          set -euo pipefail
          cos_args=(--init-skip -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" \
            -e "cos.${COS_REGION}.myqcloud.com")
          [ -z "$COS_SESSION_TOKEN" ] || cos_args+=(--token "$COS_SESSION_TOKEN")
          if ! versioning="$("$RUNNER_TEMP/coscli" bucket-versioning --method get \
            "${cos_args[@]}" "cos://${COS_BUCKET}" 2>&1)"; then
            printf '%s\n' "$versioning"
            echo "::error::COS versioning lookup failed; verify cos:GetBucketVersioning"
            exit 1
          fi
          rm_args=(--recursive --force)
          grep -Eq 'Enabled|Suspended' <<< "$versioning" && rm_args+=(--all-versions)
          if ! "$RUNNER_TEMP/coscli" ls "${cos_args[@]}" \
            "cos://${COS_BUCKET}/firmware/builds/" --limit -1 > cos-builds.txt 2>&1; then
            cat cos-builds.txt
            echo "::error::COS object listing failed; verify cos:GetBucket"
            exit 1
          fi
          python3 scripts/nightly_retention.py --storage cos --current "$BUILD_ID" \
            --previous-index previous/cn.json --candidates cos-builds.txt > obsolete-cos-builds.txt
          while IFS= read -r build_id; do
            if ! "$RUNNER_TEMP/coscli" rm "${cos_args[@]}" \
              "cos://${COS_BUCKET}/firmware/builds/${build_id}/" "${rm_args[@]}" \
              --fail-output-path "$RUNNER_TEMP/coscli-errors"; then
              find "$RUNNER_TEMP/coscli-errors" -type f -name error.report -exec cat {} + 2>/dev/null || true
              exit 1
            fi
          done < obsolete-cos-builds.txt
