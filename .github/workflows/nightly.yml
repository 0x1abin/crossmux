name: Nightly

# Daily rolling nightly build of main, published as a prerelease tagged
# `nightly` with both international (firmware.bin) and Chinese (firmware-cn.bin)
# assets. The website's Insider/Nightly reads the newest prerelease.
on:
  schedule:
    - cron: '0 23 * * *' # daily 07:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      summary_en_1:
        description: 'English OTA summary line 1 (max 42 ASCII characters)'
        required: true
        type: string
      summary_en_2:
        description: 'English OTA summary line 2 (max 42 ASCII characters)'
        required: true
        type: string
      summary_zh_1:
        description: 'Chinese OTA summary line 1 (max 16 characters)'
        required: true
        type: string
      summary_zh_2:
        description: 'Chinese OTA summary line 2 (max 16 characters)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Validate manual OTA summary
        if: github.event_name == 'workflow_dispatch'
        env:
          SUMMARY_EN_1: ${{ inputs.summary_en_1 }}
          SUMMARY_EN_2: ${{ inputs.summary_en_2 }}
          SUMMARY_ZH_1: ${{ inputs.summary_zh_1 }}
          SUMMARY_ZH_2: ${{ inputs.summary_zh_2 }}
        run: |
          mkdir -p dist
          python3 scripts/generate_ota_summary.py \
            --en-line="$SUMMARY_EN_1" \
            --en-line="$SUMMARY_EN_2" \
            --zh-line="$SUMMARY_ZH_1" \
            --zh-line="$SUMMARY_ZH_2" \
            --output dist/ota-summary.md
          test -s dist/ota-summary.md

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build CrossMux Nightly (international + Chinese)
        env:
          CROSSPOINT_RC_HASH: ${{ env.SHORT_SHA }}
        run: pio run -e gh_release_rc -e gh_release_cn_rc

      - name: Stage nightly assets
        run: |
          mkdir -p dist
          cp .pio/build/gh_release_rc/firmware.bin     dist/firmware.bin
          cp .pio/build/gh_release_cn_rc/firmware.bin  dist/firmware-cn.bin

      - name: Upload nightly build
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish-nightly:
    needs: build-nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download nightly build
        uses: actions/download-artifact@v4
        with:
          name: nightly-build
          path: dist

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build nightly release notes
        run: |
          {
            printf '%s\n' 'Rolling nightly build from `main` (${{ env.SHORT_SHA }}).'
            printf '%s\n' '- `firmware.bin` — international'
            printf '%s\n' '- `firmware-cn.bin` — Chinese (中文)'
          } > nightly-body.md
          if [ -s dist/ota-summary.md ]; then
            printf '\n' >> nightly-body.md
            cat dist/ota-summary.md >> nightly-body.md
          fi

      # Roll the single `nightly` release/tag forward to the current commit.
      - name: Remove previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: CrossMux Nightly (${{ env.SHORT_SHA }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/firmware.bin
            dist/firmware-cn.bin
          fail_on_unmatched_files: true
          body_path: nightly-body.md

      # Roll the same nightly binaries onto Gitee for the China mirror. The
      # script deletes the previous Gitee `nightly` release and recreates it.
      # Best-effort: never blocks the GitHub nightly. Needs the GITEE_TOKEN secret.
      - name: Mirror nightly to Gitee (China)
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          bash scripts/publish-gitee-release.sh \
            "x1abin/crossmux" \
            "nightly" \
            "CrossMux Nightly (${{ env.SHORT_SHA }})" \
            "true" \
            "${{ github.sha }}" \
            "nightly-body.md" \
            dist/firmware.bin dist/firmware-cn.bin
