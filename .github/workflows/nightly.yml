name: Nightly

# Daily rolling nightly build of main, published as a prerelease tagged
# `nightly` with both international (firmware.bin) and Chinese (firmware-cn.bin)
# assets. The website's Insider/Nightly reads the newest prerelease.
on:
  schedule:
    - cron: '0 23 * * *' # daily 07:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build CrossMux Nightly (international + Chinese)
        env:
          CROSSPOINT_RC_HASH: ${{ env.SHORT_SHA }}
        run: pio run -e gh_release_rc -e gh_release_cn_rc

      - name: Stage nightly assets
        run: |
          mkdir -p dist
          cp .pio/build/gh_release_rc/firmware.bin     dist/firmware.bin
          cp .pio/build/gh_release_cn_rc/firmware.bin  dist/firmware-cn.bin

      - name: Generate OTA summary
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          STABLE_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
          python3 scripts/generate_ota_summary.py --base "$STABLE_TAG" --output ota-summary.md

      - name: Build nightly release notes
        run: |
          {
            printf '%s\n' 'Rolling nightly build from `main` (${{ env.SHORT_SHA }}).'
            printf '%s\n' '- `firmware.bin` — international'
            printf '%s\n' '- `firmware-cn.bin` — Chinese (中文)'
          } > nightly-body.md
          if [ -s ota-summary.md ]; then
            printf '\n' >> nightly-body.md
            cat ota-summary.md >> nightly-body.md
          fi

      # Roll the single `nightly` release/tag forward to the current commit.
      - name: Remove previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: CrossMux Nightly (${{ env.SHORT_SHA }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: nightly-body.md

      # Roll the same nightly binaries onto Gitee for the China mirror. The
      # script deletes the previous Gitee `nightly` release and recreates it.
      # Best-effort: never blocks the GitHub nightly. Needs the GITEE_TOKEN secret.
      - name: Mirror nightly to Gitee (China)
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          bash scripts/publish-gitee-release.sh \
            "x1abin/crossmux" \
            "nightly" \
            "CrossMux Nightly (${{ env.SHORT_SHA }})" \
            "true" \
            "${{ github.sha }}" \
            "nightly-body.md" \
            dist/firmware.bin dist/firmware-cn.bin
