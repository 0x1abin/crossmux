name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: h2o
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build CrossMux (international + Chinese)
        run: pio run -e gh_release -e gh_release_cn

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp .pio/build/gh_release/firmware.bin     dist/firmware.bin
          cp .pio/build/gh_release/bootloader.bin   dist/bootloader.bin
          cp .pio/build/gh_release/partitions.bin   dist/partitions.bin
          cp .pio/build/gh_release_cn/firmware.bin  dist/firmware-cn.bin

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            dist/*
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
            .pio/build/gh_release_cn/firmware.bin
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release build
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: .

      - name: Read OTA summary from tag
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > ota-tag-message.txt
            python3 scripts/generate_ota_summary.py --input ota-tag-message.txt --output ota-summary.md
          else
            echo "::notice::OTA summary omitted: release tag is not annotated"
          fi

      # Prefer curated notes for a named release. When none are checked in,
      # build a complete commit-level changelog. GitHub's built-in
      # generate_release_notes only lists PR merges, so any commit pushed
      # straight to main would otherwise be missing from the release body.
      - name: Build release notes
        run: |
          set -euo pipefail
          CURATED_NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$CURATED_NOTES" ]; then
            cp "$CURATED_NOTES" release-body.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            {
              if [ -n "$PREV_TAG" ]; then
                echo "## Changes since ${PREV_TAG}"
                echo ""
                git log --pretty=format:"- %s (\`%h\`)" --reverse "${PREV_TAG}..HEAD"
                echo ""
                echo ""
                echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
              else
                echo "## Initial release ${{ github.ref_name }}"
              fi
            } > release-body.md
          fi
          if [ -s ota-summary.md ]; then
            printf '\n' >> release-body.md
            cat ota-summary.md >> release-body.md
          fi
          echo "---- release-body.md ----"
          cat release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CrossMux ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: release-body.md

      # Mirror the SAME binaries to Gitee so mainland-China users / device OTA
      # download from Gitee's CN CDN (see scripts/publish-gitee-release.sh).
      # GitHub is published first, but an incomplete China mirror fails this
      # workflow. Needs the GITEE_TOKEN secret (`projects` scope).
      - name: Mirror release to Gitee (China)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          bash scripts/publish-gitee-release.sh \
            "x1abin/crossmux" \
            "${{ github.ref_name }}" \
            "CrossMux ${{ github.ref_name }}" \
            "false" \
            "${{ github.sha }}" \
            "release-body.md" \
            dist/firmware.bin dist/firmware-cn.bin dist/bootloader.bin dist/partitions.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossMux-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
            .pio/build/gh_release_cn/firmware.bin
