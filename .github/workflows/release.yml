name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  select_runner:
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  build-release:
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Validate release tag
        run: |
          version="$(python3 -c 'import configparser; config = configparser.ConfigParser(); config.read("platformio.ini"); print(config["crosspoint"]["version"])')"
          case "$GITHUB_REF_NAME" in
            "$version"|"v$version") ;;
            *) echo "::error::Release tag $GITHUB_REF_NAME does not match firmware version $version"; exit 1 ;;
          esac

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Cache PlatformIO packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build unified CrossMux firmware
        run: pio run -e gh_release

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp .pio/build/gh_release/firmware.bin     dist/firmware.bin
          cp .pio/build/gh_release/bootloader.bin   dist/bootloader.bin
          cp .pio/build/gh_release/partitions.bin   dist/partitions.bin
          cp .pio/build/gh_release/firmware.bin     dist/firmware-cn.bin

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            dist/*
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release build
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: .

      - name: Read OTA release notes from tag
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > ota-tag-message.txt
            python3 scripts/generate_ota_notes.py --input ota-tag-message.txt --output ota-notes.md
          else
            echo "::notice::OTA release notes omitted: release tag is not annotated"
          fi

      # Prefer curated notes for a named release. When none are checked in,
      # build a complete commit-level changelog. GitHub's built-in
      # generate_release_notes only lists PR merges, so any commit pushed
      # straight to main would otherwise be missing from the release body.
      - name: Build release notes
        run: |
          set -euo pipefail
          CURATED_NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$CURATED_NOTES" ]; then
            cp "$CURATED_NOTES" release-body.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            {
              if [ -n "$PREV_TAG" ]; then
                echo "## Changes since ${PREV_TAG}"
                echo ""
                git log --pretty=format:"- %s (\`%h\`)" --reverse "${PREV_TAG}..HEAD"
                echo ""
                echo ""
                echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
              else
                echo "## Initial release ${{ github.ref_name }}"
              fi
            } > release-body.md
          fi
          if [ -s ota-notes.md ]; then
            printf '\n' >> release-body.md
            cat ota-notes.md >> release-body.md
          fi
          echo "---- release-body.md ----"
          cat release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CrossMux ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: release-body.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossMux-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
