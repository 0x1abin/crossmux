name: CI (build)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_HTTP_RETRIES: 10

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Run cppcheck
        run: |
          for attempt in 1 2 3; do
            pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high && exit 0
            echo "PlatformIO attempt ${attempt} failed" >&2
          done
          exit 1

  build-default:
    name: Build default and simulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install simulator build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libssl-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build default, hardware beta, and simulators
        # Keep every env in ONE pio invocation: a second `pio run` can wipe the whole
        # .pio/build tree (project-checksum mismatch after the S3 toolchain
        # installs into the restored cache), deleting the default firmware.bin
        # before the artifact upload.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pio run -e default -e eego_a4 -e mofei_m4 -e simulator -e simulator_x3 -e simulator_eego_a4 -e simulator_mofei_m4 | tee pio.log; then
              exit 0
            fi
            echo "PlatformIO attempt ${attempt} failed" >&2
          done
          exit 1

      - name: Package experimental eego A4 images
        run: python3 scripts/package_hardware_beta.py eego-a4

      - name: Package experimental Mofei M4 images
        run: python3 scripts/package_hardware_beta.py mofei-m4

      - name: Extract firmware stats

        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## Firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware.bin artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware.bin
          path: .pio/build/default/firmware.bin
          if-no-files-found: error

      - name: Upload experimental eego A4 artifact
        uses: actions/upload-artifact@v6
        with:
          name: eego-a4-experimental
          path: dist/eego-a4
          if-no-files-found: error

      - name: Upload experimental Mofei M4 artifact
        uses: actions/upload-artifact@v6
        with:
          name: mofei-m4-experimental
          path: dist/mofei-m4
          if-no-files-found: error

  build-sticky:
    name: Build sticky
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build Sticky and X4 Pro firmware
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pio run -e sticky -e x4pro | tee pio.log; then
              exit 0
            fi
            echo "PlatformIO attempt ${attempt} failed" >&2
          done
          exit 1

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## Sticky firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Run FreeInk SDK host tests
        run: |
          bash freeink-sdk/libs/book/FreeInkBook/test/host/run.sh
          bash freeink-sdk/libs/ui/FreeInkUI/test/host/run.sh

      - name: Run sync workflow state tests
        run: python3 -m unittest discover -v -s .claude/skills/sync-upstream/tests

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build-default
      - build-sticky
      - clang-format
      - cppcheck
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
