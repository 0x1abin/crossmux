name: Hardware CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/hardware-ci.yml
      - .github/workflows/nightly.yml
      - bin/ci-check
      - platformio.ini
      - partitions.csv
      - freeink-sdk
      - lib/hal/**
      - lib/EpdFont/**
      - lib/GfxRenderer/**
      - lib/WeReadWebApi/**
      - src/MappedInputManager.*
      - src/Ble*
      - src/platform/BtLibraryInUseShim.h
      - src/platform/BleIpcStack.h
      - src/platform/NimblePsramConfig.h
      - src/NetworkStartup.cpp
      - src/CrossPointSettings.*
      - src/SettingsList.h
      - src/main.cpp
      - src/activities/ActivityManager.*
      - src/activities/apps/AppsMenuActivity.cpp
      - src/activities/apps/weread/**
      - src/activities/boot_sleep/**
      - src/activities/reader/**
      - src/activities/settings/**
      - src/activities/util/IntervalSelectionActivity.*
      - src/components/icons/bluetooth.h
      - src/network/**
      - scripts/package_nightly_target.py
      - scripts/build_nightly_index.py
      - scripts/nightly_targets.py
      - scripts/git_branch.py
      - scripts/verify_nightly_release.py
      - scripts/tests/test_build_modes.py
      - scripts/tests/test_nightly_release.py
      - scripts/patch_ble_keyboard_host.py
      - scripts/configure_nimble_psram.py
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/hardware-ci.yml
      - .github/workflows/nightly.yml
      - bin/ci-check
      - platformio.ini
      - partitions.csv
      - freeink-sdk
      - lib/hal/**
      - lib/EpdFont/**
      - lib/GfxRenderer/**
      - lib/WeReadWebApi/**
      - src/MappedInputManager.*
      - src/Ble*
      - src/platform/BtLibraryInUseShim.h
      - src/platform/BleIpcStack.h
      - src/platform/NimblePsramConfig.h
      - src/NetworkStartup.cpp
      - src/CrossPointSettings.*
      - src/SettingsList.h
      - src/main.cpp
      - src/activities/ActivityManager.*
      - src/activities/apps/AppsMenuActivity.cpp
      - src/activities/apps/weread/**
      - src/activities/boot_sleep/**
      - src/activities/reader/**
      - src/activities/settings/**
      - src/activities/util/IntervalSelectionActivity.*
      - src/components/icons/bluetooth.h
      - src/network/**
      - scripts/package_nightly_target.py
      - scripts/build_nightly_index.py
      - scripts/nightly_targets.py
      - scripts/git_branch.py
      - scripts/verify_nightly_release.py
      - scripts/tests/test_build_modes.py
      - scripts/tests/test_nightly_release.py
      - scripts/patch_ble_keyboard_host.py
      - scripts/configure_nimble_psram.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: 10

jobs:
  select_runner:
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  build:
    name: Build simulators and hardware
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Use runner temporary directory
        # Avoid the self-hosted runner's shared /tmp tmpfs.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install simulator build tools
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libssl-dev xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform

      - name: Cache PlatformIO packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build simulators and hardware
        run: |
          set -euo pipefail
          mapfile -t release_environments < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); from nightly_targets import matrix; print("\n".join(entry["environment"] for entry in matrix("nightly")["include"]))')
          test "${#release_environments[@]}" -gt 0
          build_args=()
          for environment in "${release_environments[@]}"; do build_args+=(-e "$environment"); done
          pio run \
            -e simulator \
            -e simulator_x3 \
            -e simulator_eego_a4 \
            -e simulator_murphy_m4 \
            -e simulator_readpico \
            -e simulator_sticky \
            -e x4c \
            "${build_args[@]}" | tee pio.log

      - name: Check ReadPico display and input
        run: xvfb-run -a bash .pio/libdeps/simulator_readpico/simulator/tests/run_readpico_self_test.sh "$PWD"

      - name: Record firmware stats
        run: |
          {
            echo "## Simulator and hardware build stats"
            echo '```text'
            grep -E '^Processing |RAM:\s|Flash:\s' pio.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify hardware packages
        run: |
          set -euo pipefail
          mapfile -t targets < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); from nightly_targets import targets_for; print("\n".join(targets_for("nightly")))')
          test "${#targets[@]}" -gt 0
          for target in "${targets[@]}"; do
            python3 scripts/package_nightly_target.py "$target" --channel nightly
            (cd "dist/nightly/$target" && sha256sum --check *-SHA256SUMS)
          done
