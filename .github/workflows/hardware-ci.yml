name: Hardware CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/hardware-ci.yml
      - .github/workflows/nightly.yml
      - bin/ci-check
      - platformio.ini
      - partitions.csv
      - freeink-sdk
      - lib/hal/**
      - lib/EpdFont/**
      - lib/GfxRenderer/**
      - lib/WeReadWebApi/**
      - src/MappedInputManager.*
      - src/NetworkStartup.cpp
      - src/CrossPointSettings.*
      - src/SettingsList.h
      - src/main.cpp
      - src/activities/ActivityManager.*
      - src/activities/apps/AppsMenuActivity.cpp
      - src/activities/apps/weread/**
      - src/activities/boot_sleep/**
      - src/activities/reader/**
      - src/activities/settings/**
      - src/activities/util/IntervalSelectionActivity.*
      - src/network/**
      - scripts/package_nightly_target.py
      - scripts/build_nightly_index.py
      - scripts/nightly_targets.py
      - scripts/tests/test_nightly_release.py
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/hardware-ci.yml
      - .github/workflows/nightly.yml
      - bin/ci-check
      - platformio.ini
      - partitions.csv
      - freeink-sdk
      - lib/hal/**
      - lib/EpdFont/**
      - lib/GfxRenderer/**
      - lib/WeReadWebApi/**
      - src/MappedInputManager.*
      - src/NetworkStartup.cpp
      - src/CrossPointSettings.*
      - src/SettingsList.h
      - src/main.cpp
      - src/activities/ActivityManager.*
      - src/activities/apps/AppsMenuActivity.cpp
      - src/activities/apps/weread/**
      - src/activities/boot_sleep/**
      - src/activities/reader/**
      - src/activities/settings/**
      - src/activities/util/IntervalSelectionActivity.*
      - src/network/**
      - scripts/package_nightly_target.py
      - scripts/build_nightly_index.py
      - scripts/nightly_targets.py
      - scripts/tests/test_nightly_release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: 10

jobs:
  select_runner:
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  build:
    name: Build simulators and S3 hardware
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install simulator build tools
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libssl-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Cache PlatformIO packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build simulators and S3 hardware
        run: |
          set -euo pipefail
          export CROSSPOINT_RC_HASH="${GITHUB_SHA::7}"
          pio run \
            -e simulator \
            -e simulator_x3 \
            -e simulator_eego_a4 \
            -e simulator_murphy_m4 \
            -e sticky_nightly \
            -e x4pro_nightly \
            -e papermono_nightly \
            -e eego_a4_nightly \
            -e murphy_m4_nightly \
            -e waveshare_epaper_397_nightly | tee pio.log

      - name: Record firmware stats
        run: |
          {
            echo "## Simulator and S3 hardware build stats"
            echo '```text'
            grep -E '^Processing |RAM:\s|Flash:\s' pio.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify hardware packages
        run: |
          set -euo pipefail
          for target in sticky xteink_x4_pro m5stack_paper_mono eego_a4 murphy_m4 waveshare_epaper_397; do
            python3 scripts/package_nightly_target.py "$target" --channel nightly
            (cd "dist/nightly/$target" && sha256sum --check *-SHA256SUMS)
          done
