name: Hardware Beta
run-name: Hardware Beta / ${{ inputs.device }} / ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      device:
        description: Hardware target
        required: true
        type: choice
        options:
          - sticky
          - x4pro
          - papermono
          - eego-a4
          - murphy-m4
          - waveshare-epaper-397
      action:
        description: Publish or remove the rolling prerelease
        required: true
        type: choice
        options:
          - publish
          - unpublish

permissions:
  contents: write

env:
  RELEASE_TAG: hardware-beta-${{ inputs.device }}
  GITEE_REPO: x1abin/crossmux

jobs:
  build:
    if: inputs.action == 'publish'
    runs-on: ubuntu-latest
    outputs:
      crossmux_sha: ${{ steps.source.outputs.crossmux_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Record and validate source
        id: source
        run: |
          set -euo pipefail
          git -C freeink-sdk fetch origin crossmux:refs/remotes/origin/crossmux
          sdk_sha="$(git -C freeink-sdk rev-parse HEAD)"
          if ! git -C freeink-sdk merge-base --is-ancestor "$sdk_sha" origin/crossmux; then
            echo "::error::SDK gitlink $sdk_sha is not contained in 0x1abin/freeink-sdk crossmux"
            exit 1
          fi
          echo "crossmux_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Build and package
        run: |
          set -euo pipefail
          case "${{ inputs.device }}" in
            sticky) environment=sticky ;;
            x4pro) environment=x4pro ;;
            papermono) environment=papermono ;;
            eego-a4) environment=eego_a4 ;;
            murphy-m4) environment=murphy_m4 ;;
            waveshare-epaper-397) environment=waveshare_epaper_397 ;;
            *) exit 2 ;;
          esac
          pio run -e "$environment" -e "${environment}_cn"
          python3 scripts/package_hardware_beta.py "${{ inputs.device }}" \
            --flavor global --output dist/global
          python3 scripts/package_hardware_beta.py "${{ inputs.device }}" \
            --flavor zh-CN --output dist/cn
          (cd dist/global && sha256sum --check SHA256SUMS)
          (cd dist/cn && sha256sum --check SHA256SUMS)

      - name: Upload private build artifact
        uses: actions/upload-artifact@v6
        with:
          name: hardware-beta-${{ inputs.device }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.action == 'publish'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          name: hardware-beta-${{ inputs.device }}
          path: dist

      - name: Build release notes
        run: |
          cat > release-body-global.md <<EOF
          # CrossMux ${{ inputs.device }} hardware beta

          International experimental build from \`main\`.

          - CrossMux: \`${{ needs.build.outputs.crossmux_sha }}\`
          - Partition profile: \`crossmux-sticky-v1\`
          - Flash: ESP32-S3, DIO, 80 MHz, 16 MB

          Back up the complete 16 MB flash before first installation.
          EOF
          cat > release-body-cn.md <<EOF
          # CrossMux ${{ inputs.device }} 中文硬件 Beta

          从 \`main\` 构建的简体中文实验固件。

          - CrossMux: \`${{ needs.build.outputs.crossmux_sha }}\`
          - 分区布局: \`crossmux-sticky-v1\`
          - Flash: ESP32-S3, DIO, 80 MHz, 16 MB

          首次安装前请备份完整的 16 MB Flash。
          EOF

      - name: Publish rolling GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" dist/global/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.build.outputs.crossmux_sha }}" \
            --title "CrossMux ${{ inputs.device }} Hardware Beta" \
            --notes-file release-body-global.md \
            --prerelease

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir github-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir github-assets
          (cd github-assets && sha256sum --check SHA256SUMS)

      - name: Mirror prerelease to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          bash scripts/publish-gitee-release.sh \
            "$GITEE_REPO" \
            "$RELEASE_TAG" \
            "CrossMux ${{ inputs.device }} Hardware Beta" \
            "true" \
            "${{ needs.build.outputs.crossmux_sha }}" \
            release-body-cn.md \
            dist/cn/SHA256SUMS \
            dist/cn/boot_app0.bin \
            dist/cn/bootloader.bin \
            dist/cn/firmware.bin \
            dist/cn/manifest.json \
            dist/cn/partitions.bin

      - name: Verify Gitee release assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir gitee-assets
          api="https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}"
          curl -fsS "$api" | jq -r \
            '.assets[] | select(.browser_download_url | contains("/releases/download/")) | [.name, .browser_download_url] | @tsv' \
          | while IFS=$'\t' read -r name url; do
            curl -fsSL "$url" -o "gitee-assets/$name"
          done
          (cd gitee-assets && sha256sum --check SHA256SUMS)

      - name: Clean up partial rolling releases
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          api="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          release_api="${api}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}"
          release_id="$(curl -fsS "$release_api" | jq -r '.id // empty' || true)"
          if [ -n "$release_id" ]; then
            curl -fsS -X DELETE "${api}/releases/${release_id}?access_token=${GITEE_TOKEN}" || true
          fi

  unpublish:
    if: inputs.action == 'unpublish'
    runs-on: ubuntu-latest
    steps:
      - name: Remove GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Remove Gitee prerelease
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          release_id="$(curl -fsS "${api}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty' || true)"
          if [ -n "$release_id" ]; then
            curl -fsS -X DELETE "${api}/releases/${release_id}?access_token=${GITEE_TOKEN}"
          fi
