name: Sync upstream master

# Manually maintain a standing PR that merges upstream master into main.
# - Clean merge  -> push the merge to chore/sync-upstream and open/refresh the PR.
# - Conflicts    -> reset the branch, open/refresh the PR, label it
#                   `needs-claude-resolution` and list the conflicted files.
#                   The companion /schedule Claude routine resolves it later.
# This workflow NEVER merges into main — the human is always the one who
# clicks merge on the PR.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write           # gh label create / add label

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/crosspoint-reader/crosspoint-reader.git
  BASE: main
  SYNC_BRANCH: chore/sync-upstream
  LABEL: needs-claude-resolution

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: false   # tree-level merge only; submodule contents not needed

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream master
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream master --no-tags

      - name: Sync and maintain PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 1. Nothing new upstream -> done.
          new_count="$(git rev-list --count "origin/${BASE}..upstream/master")"
          echo "Upstream commits ahead of ${BASE}: ${new_count}"
          if [ "$new_count" -eq 0 ]; then
            echo "No new upstream commits — nothing to sync."
            exit 0
          fi

          owner="$GITHUB_REPOSITORY_OWNER"
          repo="${GITHUB_REPOSITORY#*/}"

          find_open_pr() {
            gh api --method GET "repos/${owner}/${repo}/pulls" \
              -f state=open \
              -f head="${owner}:${SYNC_BRANCH}" \
              -f base="$BASE" \
              --jq '.[0].number // empty'
          }

          # 2. Existing sync branch already contains both tips and has an open PR ->
          # the sync is current, so don't clobber it. Rebuild a current branch when
          # its PR is missing so ensure_pr can restore the review surface.
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$SYNC_BRANCH" --no-tags
            if git merge-base --is-ancestor upstream/master "origin/${SYNC_BRANCH}" \
               && git merge-base --is-ancestor "origin/${BASE}" "origin/${SYNC_BRANCH}"; then
              current_pr="$(find_open_pr)"
              if [ -n "$current_pr" ]; then
                echo "Sync branch and PR #${current_pr} are already up to date; skipping."
                exit 0
              fi
              echo "Sync branch is current but has no open PR; rebuilding it to restore the PR."
            fi
          fi

          # 3. Rebuild the sync branch from main and attempt the merge.
          git checkout -B "$SYNC_BRANCH" "origin/${BASE}"

          ensure_label() {
            gh label create "$LABEL" \
              --color FBCA04 \
              --description "Sync PR has merge conflicts; awaiting Claude routine" \
              2>/dev/null || true
          }

          ensure_pr() {
            # Echoes the PR number, creating the PR if none is open.
            local n body
            n="$(find_open_pr)"
            if [ -z "$n" ]; then
              body="$(printf '%s\n' \
                "Manually triggered merge of upstream \`master\` into \`${BASE}\`." \
                "" \
                "Maintained by \`.github/workflows/sync-upstream.yml\`. Review and merge when green." \
                "Conflicts (if any) are resolved automatically by the scheduled Claude routine.")"
              n="$(gh api --method POST "repos/${owner}/${repo}/pulls" \
                    -f head="${owner}:${SYNC_BRANCH}" \
                    -f base="$BASE" \
                    -f title="chore: sync upstream master into ${BASE}" \
                    -f body="$body" \
                    --jq '.number')"
            fi
            echo "$n"
          }

          add_pr_label() {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${1}/labels" \
              -f "labels[]=$LABEL" >/dev/null
          }

          remove_pr_label() {
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${1}/labels/${LABEL}" \
              >/dev/null 2>&1 || true
          }

          comment_on_pr() {
            local body
            body="$(cat)"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${1}/comments" \
              -f body="$body" >/dev/null
          }

          if git merge --no-ff --no-edit upstream/master; then
            echo "Clean merge."
            git push --force-with-lease origin "$SYNC_BRANCH"
            pr="$(ensure_pr)"
            remove_pr_label "$pr"
            printf '%s\n' "✅ Clean merge of upstream \`master\` ($(git rev-parse --short upstream/master)). Ready for review & merge." \
              | comment_on_pr "$pr"
            echo "PR #${pr} updated (clean)."
          else
            echo "Merge conflicts detected."
            conflicts="$(git diff --name-only --diff-filter=U)"
            # Seal the conflicted merge (markers stay in the tree) so the sync branch
            # has a real diff vs main; otherwise GitHub rejects an empty PR and
            # no sync PR can ever be opened when there are conflicts (which is every
            # sync, since .skills/SKILL.md always conflicts). The Claude routine
            # re-merges from scratch and force-pushes the clean resolution — this commit
            # is just a placeholder + a conflict record for the resolver to target.
            #
            # The open-x4-sdk submodule isn't checked out (submodules: false), so a
            # conflicted gitlink can't be staged with `git add` ("does not have a commit
            # checked out"). Resolve it directly in the index via plumbing — placeholder
            # = upstream's pointer; the routine sets the final one — and exclude the
            # submodule path from the worktree scan.
            if git ls-files --unmerged -- open-x4-sdk | grep -q .; then
              git update-index --cacheinfo "160000,$(git rev-parse MERGE_HEAD:open-x4-sdk),open-x4-sdk"
            fi
            git add -A -- . ':(exclude)open-x4-sdk'
            # The default GITHUB_TOKEN cannot push a commit that creates or updates any
            # .github/workflows/* file ("without `workflows` permission"). This
            # placeholder only needs to exist as a target for the resolver routine —
            # which force-pushes the real, fully-merged result with a workflow-scoped
            # PAT — so strip workflow changes from it: force the index copy of
            # .github/workflows to match ours (HEAD) exactly, dropping any upstream
            # additions or modifications.
            git rm -r -q --cached --ignore-unmatch -- .github/workflows >/dev/null 2>&1 || true
            git checkout HEAD -- .github/workflows 2>/dev/null || true
            git commit -m "chore: WIP merge upstream master (conflicts pending resolution)"
            git push --force origin "$SYNC_BRANCH"
            ensure_label
            pr="$(ensure_pr)"
            add_pr_label "$pr"
            {
              echo "⏳ Merge of upstream \`master\` ($(git rev-parse --short upstream/master)) has conflicts. Awaiting the scheduled Claude routine."
              echo ""
              echo "Conflicted files:"
              echo '```'
              echo "$conflicts"
              echo '```'
              if printf '%s\n' "$conflicts" | grep -qx '.skills/SKILL.md'; then
                echo ""
                echo "⚠️ \`.skills/SKILL.md\` (= \`CLAUDE.md\`) conflicted. Resolve it per **\`docs/engineering/upstream-merge-policy.md\`**: keep main's thin map and route the upstream delta into \`docs/engineering/\` — do NOT merge the monolith back into the map."
              fi
            } | comment_on_pr "$pr"
            echo "PR #${pr} flagged for resolution."
          fi
